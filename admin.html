<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer">
<title>Food Spot Frohheim – Mitarbeitende</title>
<style>
:root{--magenta:#d20a7c;--magenta-dark:#a90061;--lime:#c8e500;--cyan:#42b9e8;--blue:#147bd1;--ink:#242538;--muted:#697083;--bg:#f6f8fb;--card:#fff;--border:#e2e6ed;--success:#16814f;--danger:#b42318;--shadow:0 14px 34px rgba(40,48,68,.10)}
*{box-sizing:border-box} body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:#f6f8fb;color:var(--ink)}
header{background:linear-gradient(135deg,var(--magenta-dark),var(--magenta));color:#fff;padding:18px 22px;border-bottom:6px solid var(--lime)}
.header-inner{max-width:1200px;margin:auto;display:flex;align-items:center;gap:22px} .brand-logo{width:190px;max-width:42vw} .header-copy{border-left:1px solid rgba(255,255,255,.55);padding-left:22px}
header h1{margin:0;font-size:27px} header p{margin:5px 0 0;opacity:.92}
main{max-width:1200px;margin:26px auto;padding:0 16px 44px}
.card{background:#fff;border:1px solid var(--border);border-radius:18px;padding:22px;box-shadow:var(--shadow);margin-bottom:18px}
h2{color:var(--magenta);margin-top:0}
.notice{background:#eef8ff;border:1px solid #9ed7f5;border-left:6px solid var(--cyan);color:#15537a;padding:13px 15px;border-radius:13px;margin-bottom:18px}
.notice.success{background:#ecfdf3;border-color:#a6f4c5;border-left-color:var(--success);color:var(--success)}
.notice.error{background:#fff0f0;border-color:#fecdca;border-left-color:var(--danger);color:var(--danger)}
.login-grid,.filters{display:grid;grid-template-columns:1fr 1fr auto;gap:12px;align-items:end}
label{display:block;font-size:13px;font-weight:750;margin-bottom:6px}
input{width:100%;padding:12px 13px;border:1px solid #ccd3df;border-radius:11px;font:inherit;background:#fff}
button{border:0;border-radius:11px;padding:12px 18px;font:inherit;font-weight:800;cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}
.btn-primary{background:linear-gradient(135deg,var(--magenta-dark),var(--magenta));color:#fff}
.btn-secondary{background:#edf1f6;color:var(--ink)}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
table{width:100%;border-collapse:collapse;min-width:850px}
th,td{padding:10px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top}
th{background:rgba(66,185,232,.12);color:#15537a;position:sticky;top:0}
.table-wrap{overflow:auto;border:1px solid var(--border);border-radius:13px}
.badge{display:inline-block;padding:5px 8px;border-radius:999px;font-size:12px;font-weight:800}
.badge.delivered{background:#e9f4ff;color:#15537a} .badge.own{background:#f5fbd9;color:#556400} .badge.absent{background:#f1f3f5;color:#697083}
.summary-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:16px 0}
.kpi{border:1px solid var(--border);border-radius:14px;padding:14px;background:#fff} .kpi strong{display:block;font-size:25px;color:var(--magenta);margin-top:4px}
.hidden{display:none}
.small{font-size:12px;color:var(--muted)}
.userbar{display:flex;justify-content:space-between;gap:14px;align-items:center;margin-bottom:18px}
@media(max-width:760px){.login-grid,.filters,.summary-grid{grid-template-columns:1fr} .header-inner{align-items:flex-start} .brand-logo{width:145px} .header-copy{padding-left:14px}}
</style>
</head>

<main>
  <div id="systemBox" class="notice">Bitte anmelden.</div>

  <section id="loginCard" class="card">
    <h2>Mitarbeiter-Login</h2>
    <div class="login-grid">
      <div><label for="email">E-Mail</label><input id="email" type="email" autocomplete="username"></div>
      <div><label for="password">Passwort</label><input id="password" type="password" autocomplete="current-password"></div>
      <button id="loginBtn" class="btn-primary">Anmelden</button>
    </div>

  </section>

  <section id="adminArea" class="hidden">
    <div class="userbar">
      <div><strong id="userEmail"></strong><div class="small">Angemeldet</div></div>
      <button id="logoutBtn" class="btn-secondary">Abmelden</button>
    </div>

    <section class="card">
      <h2>Wochenliste</h2>
      <div class="filters">
        <div><label for="weekInput">Kalenderwoche</label><input id="weekInput" type="week"></div>
        <div></div>
        <button id="loadWeekBtn" class="btn-primary">Woche laden</button>
      </div>
      <div id="weekKpis" class="summary-grid"></div>
      <div class="table-wrap"><table><thead id="weekHead"></thead><tbody id="weekBody"></tbody></table></div>
      <div class="actions"><button id="downloadWeekBtn" class="btn-secondary" disabled>Wochenliste Excel herunterladen</button></div>
    </section>

    <section class="card">
      <h2>Monatsliste Verrechnung</h2>
      <div class="filters">
        <div><label for="monthInput">Monat</label><input id="monthInput" type="month"></div>
        <div></div>
        <button id="loadMonthBtn" class="btn-primary">Monat laden</button>
      </div>
      <div id="monthKpis" class="summary-grid"></div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Kind</th><th>Betreuungstage</th><th>Gelieferte Essen</th><th>Selbst mitgebracht</th><th>Betreuung</th><th>Essen</th><th>Total</th></tr></thead>
          <tbody id="monthBody"></tbody>
        </table>
      </div>
      <div class="actions"><button id="downloadMonthBtn" class="btn-secondary" disabled>Monatsliste Excel herunterladen</button></div>
    </section>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<script>
const SUPABASE_URL='https://clpiezszlqhueldqbczk.supabase.co';
const SUPABASE_PUBLISHABLE_KEY='sb_publishable_i4lyAnju30vHysWqHhc2RA_5E_fQqnL';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);

const $=id=>document.getElementById(id);
let currentWeekRows=[], currentMonthRows=[], currentWeekDates=[];

function showSystem(text,type='info'){
  const box=$('systemBox');
  box.className='notice'+(type==='success'?' success':type==='error'?' error':'');
  box.innerHTML=text;
}
function isoWeekString(date){
  const d=new Date(Date.UTC(date.getFullYear(),date.getMonth(),date.getDate()));
  const day=d.getUTCDay()||7; d.setUTCDate(d.getUTCDate()+4-day);
  const ys=new Date(Date.UTC(d.getUTCFullYear(),0,1));
  const w=Math.ceil((((d-ys)/86400000)+1)/7);
  return `${d.getUTCFullYear()}-W${String(w).padStart(2,'0')}`;
}
function getWeekDates(weekStr){
  const [ys,ws]=weekStr.split('-W'),year=+ys,week=+ws;
  const jan4=new Date(year,0,4),jan4Day=(jan4.getDay()+6)%7;
  const monday=new Date(year,0,4-jan4Day+(week-1)*7);
  return Array.from({length:5},(_,i)=>{const d=new Date(monday);d.setDate(monday.getDate()+i);return d;});
}
function ymd(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function chf(v){return `CHF ${Number(v||0).toFixed(2)}`}
function statusCell(r){
  if(!r || !r.attending) return '<span class="badge absent">Abgemeldet</span>';
  if(r.meal_type==='delivered') return '<span class="badge delivered">Geliefert</span>';
  return '<span class="badge own">Selbst mitgebracht</span>';
}

async function refreshSession(){
  const {data:{session}}=await sb.auth.getSession();
  if(session) showAdmin(session.user); else showLogin();
}
function showLogin(){
  $('loginCard').classList.remove('hidden'); $('adminArea').classList.add('hidden');
  showSystem('Bitte mit dem Mitarbeiterkonto anmelden.');
}
function showAdmin(user){
  $('loginCard').classList.add('hidden'); $('adminArea').classList.remove('hidden');
  $('userEmail').textContent=user.email||'Mitarbeiterkonto';
  showSystem('<strong>Angemeldet.</strong> Interne Daten können geladen werden.','success');
}
$('loginBtn').addEventListener('click',async()=>{
  $('loginBtn').disabled=true;
  try{
    const {data,error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});
    if(error)throw error;
    showAdmin(data.user);
    await loadWeek();
    await loadMonth();
  }catch(e){showSystem(`<strong>Anmeldung fehlgeschlagen.</strong><br>${e.message}`,'error')}
  finally{$('loginBtn').disabled=false}
});
$('logoutBtn').addEventListener('click',async()=>{await sb.auth.signOut();showLogin();});
$('password').addEventListener('keydown',e=>{if(e.key==='Enter')$('loginBtn').click();});

async function loadWeek(){
  const week=$('weekInput').value;if(!week)return;
  const dates=getWeekDates(week); currentWeekDates=dates;
  const p_from=ymd(dates[0]),p_to=ymd(dates[4]);
  showSystem('Wochenliste wird geladen …');
  const {data,error}=await sb.rpc('get_foodspot_week_admin',{p_from,p_to});
  if(error){showSystem(`<strong>Wochenliste konnte nicht geladen werden.</strong><br>${error.message}`,'error');return;}
  currentWeekRows=data||[];
  renderWeek();
  $('downloadWeekBtn').disabled=false;
  showSystem('<strong>Wochenliste geladen.</strong>','success');
}
function renderWeek(){
  const labels=['Montag','Dienstag','Mittwoch','Donnerstag','Freitag'];
  $('weekHead').innerHTML='<tr><th>Kind</th>'+currentWeekDates.map((d,i)=>`<th>${labels[i]}<br><span class="small">${d.toLocaleDateString('de-CH')}</span></th>`).join('')+'</tr>';
  const map=new Map();
  currentWeekRows.forEach(r=>{
    const key=r.child_id;
    if(!map.has(key))map.set(key,{name:`${r.first_name} ${r.last_name}`,days:{}});
    if(r.attendance_date)map.get(key).days[r.attendance_date]=r;
  });
  const totals=currentWeekDates.map(()=>({present:0,delivered:0}));
  $('weekBody').innerHTML=[...map.values()].map(c=>{
    const cells=currentWeekDates.map((d,i)=>{
      const r=c.days[ymd(d)];
      if(r?.attending){totals[i].present++;if(r.meal_type==='delivered')totals[i].delivered++;}
      return `<td>${statusCell(r)}</td>`;
    }).join('');
    return `<tr><td><strong>${c.name}</strong></td>${cells}</tr>`;
  }).join('')+
  `<tr><td><strong>Anwesend</strong></td>${totals.map(t=>`<td><strong>${t.present}</strong></td>`).join('')}</tr>`+
  `<tr><td><strong>Essen bestellen</strong></td>${totals.map(t=>`<td><strong>${t.delivered}</strong></td>`).join('')}</tr>`;

  const totalPresent=totals.reduce((s,t)=>s+t.present,0), totalDelivered=totals.reduce((s,t)=>s+t.delivered,0);
  $('weekKpis').innerHTML=`<div class="kpi">Anwesenheiten<strong>${totalPresent}</strong></div><div class="kpi">Gelieferte Essen<strong>${totalDelivered}</strong></div><div class="kpi">Kinder im System<strong>${map.size}</strong></div>`;
}

async function loadMonth(){
  const month=$('monthInput').value;if(!month)return;
  const [y,m]=month.split('-').map(Number);
  const from=new Date(y,m-1,1),to=new Date(y,m,0);
  showSystem('Monatsliste wird geladen …');
  const {data,error}=await sb.rpc('get_foodspot_month_admin',{p_from:ymd(from),p_to:ymd(to)});
  if(error){showSystem(`<strong>Monatsliste konnte nicht geladen werden.</strong><br>${error.message}`,'error');return;}
  currentMonthRows=data||[];
  renderMonth();
  $('downloadMonthBtn').disabled=false;
  showSystem('<strong>Monatsliste geladen.</strong>','success');
}
function renderMonth(){
  $('monthBody').innerHTML=currentMonthRows.map(r=>`<tr>
    <td><strong>${r.first_name} ${r.last_name}</strong></td>
    <td>${r.care_days}</td><td>${r.delivered_meals}</td><td>${r.own_meals}</td>
    <td>${chf(r.care_total)}</td><td>${chf(r.food_total)}</td><td><strong>${chf(r.month_total)}</strong></td>
  </tr>`).join('');
  const care=currentMonthRows.reduce((s,r)=>s+Number(r.care_total||0),0);
  const food=currentMonthRows.reduce((s,r)=>s+Number(r.food_total||0),0);
  $('monthKpis').innerHTML=`<div class="kpi">Betreuung<strong>${chf(care)}</strong></div><div class="kpi">Essen<strong>${chf(food)}</strong></div><div class="kpi">Monatstotal<strong>${chf(care+food)}</strong></div>`;
}

async function downloadWeek(){
  if(!currentWeekDates?.length || !currentWeekRows?.length){
    alert('Bitte zuerst die gewünschte Woche laden.');
    return;
  }

  const labels=['Montag','Dienstag','Mittwoch','Donnerstag','Freitag'];
  const map=new Map();
  currentWeekRows.forEach(r=>{
    if(!map.has(r.child_id)) map.set(r.child_id,{Vorname:r.first_name,Nachname:r.last_name,days:{}});
    if(r.attendance_date) map.get(r.child_id).days[r.attendance_date]=r;
  });

  const monday=currentWeekDates[0], friday=currentWeekDates[4];
  const weekValue=$('weekInput').value;
  const [yearPart,weekPart]=weekValue.split('-W');
  const weekNo=Number(weekPart);
  const dateCH=d=>d.toLocaleDateString('de-CH',{day:'2-digit',month:'2-digit',year:'numeric'});
  const dayDate=d=>d.toLocaleDateString('de-CH',{day:'2-digit',month:'2-digit',year:'numeric'});

  const wb=new ExcelJS.Workbook();
  wb.creator='Food Spot Frohheim';
  wb.created=new Date();
  const ws=wb.addWorksheet('Wochenliste',{
    pageSetup:{
      paperSize:9,
      orientation:'landscape',
      fitToPage:true,
      fitToWidth:1,
      fitToHeight:1,
      margins:{left:0.3,right:0.3,top:0.5,bottom:0.5,header:0.2,footer:0.2}
    }
  });

  ws.mergeCells('A1:G1');
  ws.getCell('A1').value=`Food Spot Frohheim – Wochenliste KW ${weekNo} / ${yearPart}`;
  ws.getCell('A1').font={bold:true,size:16,color:{argb:'FFFFFFFF'}};
  ws.getCell('A1').alignment={vertical:'middle',horizontal:'left'};
  ws.getCell('A1').fill={type:'pattern',pattern:'solid',fgColor:{argb:'FFD20A7C'}};
  ws.getRow(1).height=28;

  ws.mergeCells('A2:G2');
  ws.getCell('A2').value=`Zeitraum: ${dateCH(monday)} – ${dateCH(friday)}`;
  ws.getCell('A2').font={italic:true,color:{argb:'FF697083'}};
  ws.getCell('A2').alignment={vertical:'middle',horizontal:'left'};
  ws.getRow(2).height=21;
  ws.getRow(3).height=8;

  const headerRow=ws.getRow(4);
  headerRow.values=['Vorname','Nachname',...labels.map((label,i)=>`${label}\n${dayDate(currentWeekDates[i])}`)];
  headerRow.height=34;
  headerRow.eachCell(cell=>{
    cell.font={bold:true,color:{argb:'FF15537A'}};
    cell.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FFDFF2FB'}};
    cell.alignment={vertical:'middle',horizontal:'center',wrapText:true};
    cell.border={top:{style:'thin',color:{argb:'FFB9DCEB'}},left:{style:'thin',color:{argb:'FFB9DCEB'}},bottom:{style:'thin',color:{argb:'FFB9DCEB'}},right:{style:'thin',color:{argb:'FFB9DCEB'}}};
  });
  headerRow.getCell(1).alignment={vertical:'middle',horizontal:'left'};
  headerRow.getCell(2).alignment={vertical:'middle',horizontal:'left'};

  [...map.values()].forEach(c=>{
    const values=[c.Vorname,c.Nachname];
    currentWeekDates.forEach(d=>{
      const r=c.days[ymd(d)];
      values.push(!r||!r.attending?'Abgemeldet':r.meal_type==='delivered'?'Geliefert':'Selbst mitgebracht');
    });
    const row=ws.addRow(values);
    row.height=24;
    row.eachCell((cell,col)=>{
      cell.alignment={vertical:'middle',horizontal:col<=2?'left':'center',wrapText:true};
      cell.border={top:{style:'thin',color:{argb:'FFE2E6ED'}},left:{style:'thin',color:{argb:'FFE2E6ED'}},bottom:{style:'thin',color:{argb:'FFE2E6ED'}},right:{style:'thin',color:{argb:'FFE2E6ED'}}};
      if(col>=3){
        if(cell.value==='Geliefert') cell.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FFE7F2FE'}};
        if(cell.value==='Selbst mitgebracht') cell.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FFF1F8D6'}};
        if(cell.value==='Abgemeldet') cell.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FFF0F1F3'}};
      }
    });
  });

  const present=['Anwesend',''];
  const food=['Essen bestellen',''];
  currentWeekDates.forEach(d=>{
    const date=ymd(d);
    const rs=currentWeekRows.filter(r=>r.attendance_date===date);
    present.push(rs.filter(r=>r.attending).length);
    food.push(rs.filter(r=>r.attending&&r.meal_type==='delivered').length);
  });
  const presentRow=ws.addRow(present);
  const foodRow=ws.addRow(food);
  [presentRow,foodRow].forEach(row=>{
    row.height=24;
    row.font={bold:true};
    row.eachCell((cell,col)=>{
      cell.alignment={vertical:'middle',horizontal:col<=2?'left':'center'};
      cell.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FFF8FBE7'}};
      cell.border={top:{style:'thin',color:{argb:'FFD7E08C'}},left:{style:'thin',color:{argb:'FFD7E08C'}},bottom:{style:'thin',color:{argb:'FFD7E08C'}},right:{style:'thin',color:{argb:'FFD7E08C'}}};
    });
  });
  ws.mergeCells(`A${presentRow.number}:B${presentRow.number}`);
  ws.mergeCells(`A${foodRow.number}:B${foodRow.number}`);

  ws.columns=[
    {width:18},{width:20},{width:22},{width:22},{width:22},{width:22},{width:22}
  ];
  ws.views=[{state:'frozen',ySplit:4,xSplit:2}];
  ws.autoFilter={from:{row:4,column:1},to:{row:4,column:7}};
  ws.pageSetup.printArea=`A1:G${foodRow.number}`;
  ws.headerFooter.oddFooter='&LFood Spot Frohheim&CSeite &P von &N&RKW '+weekNo+' / '+yearPart;

  const buffer=await wb.xlsx.writeBuffer();
  const blob=new Blob([buffer],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download=`Foodspot_Wochenliste_KW${String(weekNo).padStart(2,'0')}_${yearPart}.xlsx`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function downloadMonth(){
  const rows=currentMonthRows.map(r=>({
    Vorname:r.first_name,Nachname:r.last_name,
    Betreuungstage:Number(r.care_days),Gelieferte_Essen:Number(r.delivered_meals),Selbst_mitgebracht:Number(r.own_meals),
    Betreuung_CHF:Number(r.care_total),Essen_CHF:Number(r.food_total),Total_CHF:Number(r.month_total)
  }));
  const ws=XLSX.utils.json_to_sheet(rows);
  const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,'Monatsabrechnung');
  XLSX.writeFile(wb,`Foodspot_Monatsabrechnung_${$('monthInput').value}.xlsx`);
}

$('loadWeekBtn').addEventListener('click',loadWeek);
$('loadMonthBtn').addEventListener('click',loadMonth);
$('downloadWeekBtn').addEventListener('click',downloadWeek);
$('downloadMonthBtn').addEventListener('click',downloadMonth);

const now=new Date();
$('weekInput').value=isoWeekString(now);
$('monthInput').value=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
refreshSession();
</script>
</body>
</html>
